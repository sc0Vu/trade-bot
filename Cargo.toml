[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/strategy",
    "crates/exchange",
    "crates/engine",
    "crates/backtest",
    "crates/storage",
    "crates/api",
    "crates/cli",
    "migration",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "MIT"

[workspace.dependencies]
bot-core = { path = "crates/core" }
strategy = { path = "crates/strategy" }
exchange = { path = "crates/exchange" }
engine = { path = "crates/engine" }
backtest = { path = "crates/backtest" }
storage = { path = "crates/storage" }
api = { path = "crates/api" }
migration = { path = "migration" }

anyhow = "1.0.104"
axum = "0.8.9"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
hex = "0.4.3"
hmac = "0.13.0"
inventory = "0.3.25"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = ["http-listener"] }
metrics-process = "2.4.3"
metrics-util = { version = "0.20.4", default-features = false, features = ["debugging"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "http2", "query"] }
rust_decimal = "1.43.0"
rust_decimal_macros = "1.40.0"
serde = { version = "1.0.229", features = ["derive"] }
sea-orm = { version = "2.0.4", default-features = false, features = ["macros", "runtime-tokio", "sqlx-sqlite", "sqlx-mysql"] }
sea-orm-migration = { version = "2.0.4", features = ["runtime-tokio", "sqlx-sqlite", "sqlx-mysql"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Dev builds sized for small disks (measured: default 1.2 GB target/).
# Dependencies are most of target/ and are never debugged here, so they get
# no debug info; our crates keep line tables so panic backtraces still show
# file:line. Incremental is off: it saves ~190 MB that otherwise grows with
# every edit-rebuild, at the cost of slower rebuilds of our own crates.
[profile.dev]
incremental = false
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
