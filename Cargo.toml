[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/strategy",
    "crates/exchange",
    "crates/engine",
    "crates/backtest",
    "crates/storage",
    "crates/cli",
    "migration",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
bot-core = { path = "crates/core" }
strategy = { path = "crates/strategy" }
exchange = { path = "crates/exchange" }
engine = { path = "crates/engine" }
backtest = { path = "crates/backtest" }
storage = { path = "crates/storage" }
migration = { path = "migration" }

async-trait = "0.1.92"
inventory = "0.3.25"
rust_decimal = "1.43.0"
rust_decimal_macros = "1.40.0"
serde = { version = "1.0.229", features = ["derive"] }
sea-orm = { version = "2.0.4", default-features = false, features = ["macros", "runtime-tokio", "sqlx-sqlite", "sqlx-mysql"] }
sea-orm-migration = { version = "2.0.4", features = ["runtime-tokio", "sqlx-sqlite", "sqlx-mysql"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread"] }
toml = "1.1.8"
tracing = "0.1.44"
