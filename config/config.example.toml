# Example configuration. Copy to config/config.toml or config/*.local.toml
# (both gitignored) and edit. Every field is listed here.
#
# Load order: this file (--config, else BOT_CONFIG, else config/config.toml),
# then BOT_* environment variables, nested with "__":
#   BOT_EXCHANGE__TESTNET=true  BOT_STRATEGY__NAME=ratio_hop
# Unknown fields are errors, so a typo never silently becomes a default.
#
# Secrets never go in this file, and there is no field for them: API keys
# are read only from the BINANCE_API_KEY / BINANCE_API_SECRET environment
# variables. Keys belong to one network: testnet keys come from
# testnet.binance.vision, demo keys from demo.binance.com, live keys from
# binance.com. A key used on the wrong network is refused (-2015).
#
# Money values (prices, quantities, fees, notionals) are strings, e.g.
# fee = "0.001". A bare number is rejected: TOML parses it as a binary float,
# which loses precision before it can become a Decimal.
#
# Instruments are written venue:SYMBOL, e.g. "binance:BTCUSDT".

# "paper" (default) or "live". Live trading needs ALL of: mode = "live",
# exchange.network = "live", and `run --live --i-understand`.
mode = "paper"

# The only instruments the bot may trade. Must not be empty.
# Full ids ("binance:BTCUSDT") or bare symbols on exchange.venue below
# ("BTCUSDT"). Params naming a whitelisted symbol get its venue the same way.
whitelist = ["binance:BTCUSDT", "binance:ETHUSDT"]

[exchange]
# "binance" (default) or "max" (MAX by MaiCoin). MAX has no testnet: with
# venue = "max" only paper runs are allowed, on MAX's live prices with the
# local paper broker below ([paper] required, no API key read), and the
# whitelist must be max: instruments (max:BTCTWD, max:BTCUSDT).
# "etoro": eToro's demo account under --paper (network "demo"), real money
# through the live gate; whitelist etoro: instruments (etoro:AAPL); keys
# ETORO_PUBLIC_KEY / ETORO_PRIVATE_KEY from env (README, "eToro").
# "binance-usdm" (USDⓈ-M perpetuals): whitelist binance-usdm: instruments,
# [perp] required. [perp] fills = "local" (default): paper on live futures
# prices with local fills ([paper] required); "venue": orders on
# exchange.network's futures exchange, gated like spot (see README,
# "Perpetual futures").
venue = "binance"
# Binance only:
# "testnet" (default): testnet.binance.vision, fake balances.
# "demo": demo.binance.com Demo Trading, fake balances, mainnet-like prices.
# "live": mainnet, real money (needs the other two locks above).
network = "testnet"
# Optional host overrides; defaults follow `network`. A testnet or demo run
# refuses any real-money *.binance.com host here (only demo-api / demo-stream
# are allowed).
# rest_url = "https://testnet.binance.vision"
# ws_url = "wss://stream.testnet.binance.vision"
# Kline interval the strategy trades on: 1s, 1m, 5m, 15m, 1h, 4h, 1d.
# At 1s, strategy periods are in seconds. Without the user stream (below)
# every open order is polled each second (about 9 request weight per order
# per second; the rate limiter keeps it within Binance's limits).
interval = "1m"
# Longest one Binance REST request may take, in seconds (default 10). A
# request that runs out stops the run; orders it may have placed are found
# by reconcile on exit or next start. Must be >= 1.
http_timeout_secs = 10
# If the market-data feed drops or stalls, reconnect for up to this many
# seconds (backoff 1 s doubling to 60 s), backfilling the missed bars; past
# that the run stops and its open orders are cancelled. Default 600.
max_outage_secs = 600
# Subscribe to Binance's user data stream (WebSocket API) so only orders
# that changed are polled, plus every order once a minute; without it every
# open order is polled every event. A stream that fails to connect is a
# warning and falls back to polling everything. Off while rest_url is set.
# Default true.
user_stream = true

[strategy]
# A registered strategy: atr_breakout, avwap, bollinger_reversion,
# buy_and_hold, dca, donchian_breakout, dual_ma_cross, grid, ichimoku,
# macd_cross, momentum_rotation, pair_reversion, ratio_hop, rebalance,
# risk_parity, rsi_reversion, sma_trend, stochastic, supertrend,
# top_k_momentum, trailing_stop, tsmom, vol_target, volatility_breakout; or "rhai" (a build with the `rhai`
# feature) to run a script named by strategy.params.script.
# config/examples/ has a complete config for each.
name = "ratio_hop"

# Strategy-specific; checked when the strategy is built.
[strategy.params]
coins = ["binance:BTCUSDT", "binance:ETHUSDT"]
quote_amount = "100"
fee = "0.001"
slippage_bps = "5"
scout_margin = "0.002"
freefall_pct = "0.2"
freefall_candles = 60
order_type = "limit"
limit_timeout = 3

# Margin of a perpetual paper run (exchange.venue = "binance-usdm" only;
# required there). Brackets come from the account: BINANCE_API_KEY /
# BINANCE_API_SECRET must be set and belong to brackets_from's network.
# [perp]
# fills = "local"           # "local" (paper, local broker) or "venue" (orders on Binance)
# leverage = 2              # every symbol; refused above the bracket's max
# margin = "isolated"       # or "cross"
# brackets_from = "demo"    # "demo" (default), "testnet" or "live"
# clearance = "0.0125"      # default: the symbols' published liquidationFee

# eToro account declarations (exchange.venue = "etoro" only).
# [etoro]
# w8ben_signed = false      # true once your W-8BEN is on file: a real account
#                           # needs it for US stocks (refused at start otherwise)

# The local paper broker, for venue = "max" (Binance paper runs use its
# testnet or demo network instead). Same model as `backtest`: an order
# fills at the next bar's open, taker fills slipped. Positions live in
# memory, so every run starts flat from initial_cash; saved strategy state
# is not resumed. Money values are strings.
# [paper]
# initial_cash = "30000"   # in the first whitelisted instrument's quote (TWD here)
# fee = "0.0015"           # your MAX fee rate (placeholder, not verified)
# slippage_bps = "20"      # required; MAX books are thinner than Binance's

[engine]
# Candles of history kept per instrument for the strategy. Must exceed
# ratio_hop's freefall_candles.
history_len = 500
# Hours before a coin's scheduled delisting at which the engine itself
# cancels orders on it and sells the holding at market, whatever the
# strategy does; new buys are refused from the announcement on. On Binance
# the schedule comes from the live API only (demo and testnet don't
# publish it).
delist_exit_hours = 24
# Kill switch (off unless both are set): once the run's equity
# (kill_capital + its P&L: realized, plus open positions at their last
# close) falls kill_drawdown below its peak, the engine stops the strategy,
# cancels every order, closes every position at market (reduce-only) and
# ends the run. A marker under data/kill-switch/ then refuses the next
# start until `run --clear-kill-switch`, so a supervisor can't quietly
# resume. Backtests: --kill-drawdown (capital = --initial-cash).
# kill_drawdown = "0.25"     # 25% from the peak
# kill_capital = "1000"      # what the strategy trades with, in its quote

# Keep a share of the quote cash in Binance Simple Earn. Off by default.
# Live network only: Binance serves Simple Earn on its live host alone.
# The ratio counts the account's whole quote cash (spot free + Earn), so
# strategies trade from the rest; buys never wait on a redemption.
[earn]
# enabled = true
# ratio = "0.1"            # keep 10% of the quote cash in Earn
# band = "0.01"            # move only when off by more than 1% of it
# product = "flexible"     # or "locked" (topped up, never redeemed early)
# locked_days = 30         # term of the locked product (with "locked")
# interval_minutes = 60    # time between sweeps

[db]
# Where `run` keeps its books: orders sent, fills, holdings. Default: one
# SQLite file per network, data/<network>.db (data/ is gitignored). The
# database is stamped with its network on first use; opening it for another
# network is refused, so fake fills never count as real holdings.
# url = "sqlite://data/demo.db?mode=rwc"

[metrics]
# Prometheus metrics at http://<listen>/metrics during `run` (orders, fills,
# rejections, feed age, Binance latency and errors, reconcile, process
# memory/CPU). Off by default. If the endpoint can't start, trading goes on.
enabled = false
# The endpoint has no authentication: loopback only unless allow_public.
listen = "127.0.0.1:9184"
# Also export positions, cost basis and realized P&L (the account's books).
include_money = false
# Permit a non-loopback listen address. Put a firewall or an authenticating
# proxy in front if you set this.
allow_public = false

[api]
# Read-only JSON API during `run`: /status, /positions, /open-orders,
# /orders?limit=N, /trades?limit=N. It can't place or cancel anything.
# Off by default; if it can't start, trading goes on.
enabled = false
# Loopback only unless allow_public. Off loopback a bearer token is
# required, read from the TRADEBOT_API_TOKEN environment variable (never
# from this file); put TLS in front, since the token travels in a header.
listen = "127.0.0.1:9185"
allow_public = false
# A dashboard page at http://<listen>/ (needs enabled): the run, positions
# with value and P&L at the last close, open orders, latest bars, recent
# trades and orders, refreshed every 5 s. Read-only, like the API; with a
# token set, the page asks for it.
dashboard = false

[log]
# What `run` logs, as a tracing filter (same syntax as RUST_LOG): a default
# level plus per-crate overrides. Default "info,sqlx=warn" (sqlx logs every
# SQL statement at info). RUST_LOG, when set, overrides this. A filter that
# doesn't parse fails at startup.
# level = "info,sqlx=error"      # also hide slow-statement warnings
# level = "info,exchange=debug"  # more detail from the exchange layer
# Console format: "text" (default) or "json", one object per line, for a
# container or supervisor that collects stdout.
format = "text"
# Also append every line as JSON to this file, for a log shipper to tail
# (deploy/ ships Grafana Alloy into Loki; Vector or the Datadog agent read
# it too). Keys: timestamp, level, target, message, then the event's
# fields; order lines' `order` is the client order id Binance holds
# (<run tag>-o-N). Not rotated by the bot: rotate with copytruncate.
# Unset: no file.
# A file that can't be opened is a warning; the run goes on.
# file = "data/logs/run.jsonl"
