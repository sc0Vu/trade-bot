# Example configuration. Copy to config/config.toml or config/*.local.toml
# (both gitignored) and edit. Every field is listed here.
#
# Load order: this file (--config, else BOT_CONFIG, else config/config.toml),
# then BOT_* environment variables, nested with "__":
#   BOT_EXCHANGE__TESTNET=true  BOT_STRATEGY__NAME=ratio_hop
# Unknown fields are errors, so a typo never silently becomes a default.
#
# Secrets never go in this file, and there is no field for them: API keys
# are read only from the BINANCE_API_KEY / BINANCE_API_SECRET environment
# variables. Keys belong to one network: testnet keys come from
# testnet.binance.vision, demo keys from demo.binance.com, live keys from
# binance.com. A key used on the wrong network is refused (-2015).
#
# Money values (prices, quantities, fees, notionals) are strings, e.g.
# fee = "0.001". A bare number is rejected: TOML parses it as a binary float,
# which loses precision before it can become a Decimal.
#
# Instruments are written venue:SYMBOL, e.g. "binance:BTCUSDT".

# "paper" (default) or "live". Live trading needs ALL of: mode = "live",
# exchange.network = "live", and `run --live --i-understand`.
mode = "paper"

# The only instruments the bot may trade. Must not be empty.
whitelist = ["binance:BTCUSDT", "binance:ETHUSDT"]

[exchange]
# "testnet" (default): testnet.binance.vision, fake balances.
# "demo": demo.binance.com Demo Trading, fake balances, mainnet-like prices.
# "live": mainnet, real money (needs the other two locks above).
network = "testnet"
# Optional host overrides; defaults follow `network`. A testnet or demo run
# refuses any real-money *.binance.com host here (only demo-api / demo-stream
# are allowed).
# rest_url = "https://testnet.binance.vision"
# ws_url = "wss://stream.testnet.binance.vision"
# Kline interval the strategy trades on: 1s, 1m, 5m, 15m, 1h, 4h, 1d.
# At 1s, strategy periods are in seconds, and every open order is polled
# each second (about 9 request weight per order per second; the rate
# limiter keeps it within Binance's limits).
interval = "1m"
# Longest one Binance REST request may take, in seconds (default 10). A
# request that runs out stops the run; orders it may have placed are found
# by reconcile on exit or next start. Must be >= 1.
http_timeout_secs = 10
# If the market-data feed drops or stalls, reconnect for up to this many
# seconds (backoff 1 s doubling to 60 s), backfilling the missed bars; past
# that the run stops and its open orders are cancelled. Default 600.
max_outage_secs = 600

[strategy]
# A registered strategy: buy_and_hold, donchian_breakout, dual_ma_cross,
# momentum_rotation, ratio_hop, rsi_reversion, sma_trend.
name = "ratio_hop"

# Strategy-specific; checked when the strategy is built.
[strategy.params]
coins = ["binance:BTCUSDT", "binance:ETHUSDT"]
quote_amount = "100"
fee = "0.001"
slippage_bps = "5"
scout_margin = "0.002"
freefall_pct = "0.2"
freefall_candles = 60
order_type = "limit"
limit_timeout = 3

[engine]
# Candles of history kept per instrument for the strategy. Must exceed
# ratio_hop's freefall_candles.
history_len = 500

[db]
# Where `run` keeps its books: orders sent, fills, holdings. Default: one
# SQLite file per network, data/<network>.db (data/ is gitignored). The
# database is stamped with its network on first use; opening it for another
# network is refused, so fake fills never count as real holdings.
# url = "sqlite://data/demo.db?mode=rwc"

[metrics]
# Prometheus metrics at http://<listen>/metrics during `run` (orders, fills,
# rejections, feed age, Binance latency and errors, reconcile, process
# memory/CPU). Off by default. If the endpoint can't start, trading goes on.
enabled = false
# The endpoint has no authentication: loopback only unless allow_public.
listen = "127.0.0.1:9184"
# Also export positions, cost basis and realized P&L (the account's books).
include_money = false
# Permit a non-loopback listen address. Put a firewall or an authenticating
# proxy in front if you set this.
allow_public = false

[api]
# Read-only JSON API during `run`: /status, /positions, /open-orders,
# /orders?limit=N, /trades?limit=N. It can't place or cancel anything.
# Off by default; if it can't start, trading goes on.
enabled = false
# Loopback only unless allow_public. Off loopback a bearer token is
# required, read from the TRADEBOT_API_TOKEN environment variable (never
# from this file); put TLS in front, since the token travels in a header.
listen = "127.0.0.1:9185"
allow_public = false
