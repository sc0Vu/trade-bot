# rebalance: hold fixed weights of a capital and trade back to them when
# one drifts past the band. Here half BTC, half USDT: sells some BTC after
# a rise, buys some after a fall. Earns from swings that come back; trails
# holding in a one-way trend; each rebalance pays fee and slippage on what
# it trades. Not tuned; edge unverified.
#
#   cargo run -p cli -- run --paper --config config/examples/rebalance.toml

mode = "paper"
whitelist = ["binance:BTCUSDT"]

[exchange]
network = "testnet"
interval = "1d"

[strategy]
name = "rebalance"

[strategy.params]
# Coin -> fraction of the portfolio; what's left of 1 stays in USDT. Add
# coins with the same quote asset, e.g. "binance:ETHUSDT" = "0.25".
weights = { "binance:BTCUSDT" = "0.5" }
capital = "1000"        # USDT the strategy manages (its starting cash)
band = "0.05"           # trade back once a weight is 5 points off
fee = "0.001"
slippage_bps = "5"
