# Announced Binance spot delistings, replayed by backtests at their
# announcement time (no lookahead: a backtest learns of a delisting when a
# live run would have). Each entry is evidence: the announcement's time,
# the delisting time, and the announcement it comes from. Times in UTC.
#
# Halts nobody announced (a crash suspension) don't belong here: the
# backtest cuts a series at any gap longer than --max-gap-hours and treats
# it as a delisting with no notice.
#
# [[delisting]]
# symbol = "XXXUSDT"
# announced = 2024-01-01T00:00:00Z
# at = 2024-01-15T03:00:00Z
# source = "https://www.binance.com/en/support/announcement/..."

# EOS token swap and rebrand to Vaulta (A), 1 EOS -> 1 A: Binance removed
# every EOS spot pair and cancelled pending EOS orders at 03:00 UTC on
# 2025-05-26. Published 2025-05-14; the time of day isn't given, so the end
# of that day is used (later can't leak the future). A swap, not a loss:
# the backtest sells EOS before it, as a holder could have; the A series
# that followed is a new listing.
[[delisting]]
symbol = "EOSUSDT"
announced = 2025-05-14T23:59:00Z
at = 2025-05-26T03:00:00Z
source = "https://www.binance.com/en/support/announcement/1e89a9ca957c4b0ca7502e60b993e201"
