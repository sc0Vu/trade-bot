[package]
name = "strategy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Strategies written as Rhai scripts (`strategy.name = "rhai"`). Off by
# default: the default build stays as small as before.
rhai = ["dep:rhai", "dep:sha2", "dep:hex"]

[dependencies]
bot-core.workspace = true
hex = { workspace = true, optional = true }
rhai = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
inventory.workspace = true
# `maths`: `powd` for a geometric grid's level ratio.
rust_decimal = { workspace = true, features = ["maths"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
rust_decimal.workspace = true
rust_decimal_macros.workspace = true
