[package]
name = "exchange"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
bot-core.workspace = true
futures-util.workspace = true
hex.workspace = true
hmac.workspace = true
metrics.workspace = true
reqwest.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
storage.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "net"] }
tokio-tungstenite.workspace = true
tracing.workspace = true

[features]
# Build OpenSSL from source and link it statically (Linux; macOS and
# Windows use the system TLS either way), so a release binary doesn't
# depend on the host's libssl version.
vendored-tls = ["reqwest/native-tls-vendored", "tokio-tungstenite/native-tls-vendored"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
metrics-util.workspace = true
rust_decimal_macros.workspace = true
