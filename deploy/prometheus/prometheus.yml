# Scrapes the bot's /metrics (enable [metrics] in config/config.toml).
#
# The target is TRADEBOT_METRICS_TARGET from deploy/.env, filled in when
# the container starts; default host.docker.internal:9184, the bot's
# default port. From the compose stack the host is reached as
# host.docker.internal: Docker Desktop (macOS, Windows) maps that to the
# host's loopback. On Linux, run Prometheus on the host instead,
# or bind the bot to the docker bridge address with metrics.allow_public.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: trade-bot
    static_configs:
      # Filled in at start from TRADEBOT_METRICS_TARGET (deploy/.env).
      - targets: ["__TRADEBOT_METRICS_TARGET__"]
